<main class="page">
  <!-- Fondo 9:16 adaptativo -->
  <div class="page__bg" aria-hidden="true">
    <img
        class="page__bg__img"
        appLazyImg="images/background.jpg"
        placeholder="images/tiny-background.jpg"
        alt="" />
  </div>

  <!-- Marca / Logo -->
  <section class="brand">
    <div class="brand__halo">
      <img
        class="brand__logo"
        appLazyImg="images/logo.png"
        placeholder="images/tiny-logo.png"
        alt="Logo"
      />
    </div>

    <!-- Opcional: descomenta y rellena si quieres nombre y subtítulo -->
    <!--
    <p class="brand__name">Tu Nombre</p>
    <div class="brand__ornament" aria-hidden="true">
      <span class="ornament__line"></span>
      <span class="ornament__diamond"></span>
      <span class="ornament__line ornament__line--right"></span>
    </div>
    <p class="brand__tagline">Tu tagline aquí</p>
    -->

    <div class="brand__ornament" aria-hidden="true">
      <span class="ornament__line"></span>
      <span class="ornament__diamond"></span>
      <span class="ornament__line ornament__line--right"></span>
    </div>
  </section>

  <!-- Links -->
  <nav class="links" aria-label="Redes sociales">
    <ng-container *ngFor="let link of links$ | async; let i = index; trackBy: trackByName">
      <a
        *ngIf="link.isVisible"
        class="link-card"
        [style.--i]="i"
        [href]="link.value"
        target="_blank"
        rel="noopener noreferrer"
      >
        <!-- Icono -->
        <span class="link-card__icon">
          <img
            *ngIf="getIconSrc(link, false) && !hasIconError(link.name)"
            class="icon--external"
            [appLazyImg]="getIconSrc(link, true)"
            [placeholder]="getIconSrc(link, false)"
            [alt]="link.name"
            loading="lazy"
            (error)="onIconError(link.name)"
          />
          <!-- Fallback: primera letra -->
          <span
            class="link-card__fallback"
            *ngIf="!getIconSrc(link, false) || hasIconError(link.name)"
            aria-hidden="true"
            >{{ link.name.charAt(0) }}</span
          >
        </span>

        <span class="link-card__name">{{ link.name }}</span>

        <!-- Flecha inline SVG (sin dependencias) -->
        <span class="link-card__arrow" aria-hidden="true">
          <svg viewBox="0 0 16 16">
            <polyline points="5 3 11 8 5 13" />
          </svg>
        </span>
      </a>
    </ng-container>
  </nav>
</main>

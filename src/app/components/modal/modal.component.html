<div class="image-modal" *ngIf="visible()" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <img [src]="imageSrc" alt="Image" class="modal-image" />

    <div class="value-container" (click)="copyValue()">
      <span class="value-text">
        {{ value }}
        <button type="button" class="copy-button" title="Copiar valor" aria-label="Copiar valor">
          <span class="link-card__arrow" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
              <rect x="4" y="3.5" width="9" height="11" rx="1.5" />
              <path d="M6 3.5V2.5H11V3.5" />
              <path d="M6.5 7H10.5M6.5 9.5H10.5" />
            </svg>
          </span>
        </button>
      </span>

      <span class="info-text">
        {{ copiedStatus() }}
      </span>

    </div>
  </div>

  <button class="close-button" (click)="close()">×</button>
</div>
